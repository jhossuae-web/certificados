<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Verificación de certificados</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6fa;color:#172033;font:16px/1.5 system-ui,"Segoe UI",Arial,sans-serif;display:flex;justify-content:center;padding:28px 16px}
main{width:100%;max-width:520px}
h1{font-size:21px;margin:0 0 6px}
.sub{margin:0 0 18px;color:#667085;font-size:14px}
form{display:flex;gap:8px;margin-bottom:18px}
input{flex:1;min-width:0;border:1px solid #d5dbe5;border-radius:8px;padding:12px;font:inherit;text-transform:uppercase;letter-spacing:.06em;background:#fff}
button{border:0;border-radius:8px;padding:12px 16px;background:#2457d6;color:#fff;font:inherit;font-weight:650;cursor:pointer}
.card{background:#fff;border:1px solid #e5e9f0;border-radius:14px;padding:20px;box-shadow:0 4px 18px #17203308}
.badge{display:inline-block;font-weight:700;font-size:14px;padding:5px 12px;border-radius:20px;margin-bottom:12px}
.ok .badge{background:#ecfdf3;color:#067647}
.bad .badge{background:#fef3f2;color:#b42318}
.wait .badge{background:#f2f4f7;color:#475467}
.issuer{margin:0 0 12px;color:#475467;font-size:14px}
dl{margin:0}
dt{font-size:12px;color:#667085;margin-top:12px}
dd{margin:2px 0 0;font-size:17px;font-weight:600;word-break:break-word}
.msg{margin:0;color:#475467;font-size:14px}
.foot{margin-top:16px;padding-top:12px;border-top:1px solid #e5e9f0;font-size:12px;color:#667085}
</style>
</head>
<body>
<main>
  <h1>Verificación de certificados</h1>
  <p class="sub">Escribe el código que aparece en el certificado o escanea su código QR.</p>
  <form id="f"><input id="code" type="text" placeholder="Ej. A7Q2 K7M2Q X9P4R" autocomplete="off" autocapitalize="characters" spellcheck="false"><button type="submit">Verificar</button></form>
  <div id="out"></div>
</main>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const out=$('out');
const enc=s=>new TextEncoder().encode(s);
const hex=u=>[...u].map(x=>x.toString(16).padStart(2,'0')).join('');
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

function show(kind,badge,body,rows,foot){
 out.textContent='';
 const card=document.createElement('div');card.className='card '+kind;
 const b=document.createElement('span');b.className='badge';b.textContent=badge;card.appendChild(b);
 if(body){const p=document.createElement('p');p.className=rows?'issuer':'msg';p.textContent=body;card.appendChild(p)}
 if(rows){const dl=document.createElement('dl');rows.forEach(([k,v])=>{const dt=document.createElement('dt');dt.textContent=k;const dd=document.createElement('dd');dd.textContent=v;dl.append(dt,dd)});card.appendChild(dl)}
 if(foot){const f=document.createElement('div');f.className='foot';f.textContent=foot;card.appendChild(f)}
 out.appendChild(card);
}
const notFound=()=>show('bad','No encontrado','No encontramos un certificado con este código. Revisa que esté bien escrito o consulta a quien lo emitió.');

async function verificar(raw){
 const code=(raw||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
 if(code.length!==14){show('bad','Código incompleto','El código tiene 14 caracteres (letras y números). Revisa que estén todos.');return}
 if(!window.crypto||!crypto.subtle){show('bad','Navegador no compatible','Abre esta página con un navegador actualizado (Chrome, Safari, Edge o Firefox).');return}
 show('wait','Verificando...');
 const lote=code.slice(0,4),p=code.slice(4);
 let j;
 try{const r=await fetch(lote+'.json',{cache:'no-store'});if(!r.ok)throw new Error('x');j=await r.json()}catch(e){notFound();return}
 try{
  const id=hex(new Uint8Array(await crypto.subtle.digest('SHA-256',enc(lote+'|'+p)))).slice(0,24);
  const blob=j.d&&j.d[id];if(!blob){notFound();return}
  const raw2=unb64(blob);
  const base=await crypto.subtle.importKey('raw',enc(p),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:unb64(j.s),iterations:j.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:raw2.slice(0,12)},key,raw2.slice(12));
  const rec=JSON.parse(new TextDecoder().decode(pt));
  const shown=lote+' '+p.slice(0,5)+' '+p.slice(5);
  const revoked=(rec.f||[]).some(([k,v])=>/estado/i.test(k)&&/anulad|revocad/i.test(v));
  if(revoked)show('bad','Certificado anulado',rec.e?'Emitido por '+rec.e:'',rec.f,'Código: '+shown);
  else show('ok','Certificado auténtico',rec.e?'Emitido por '+rec.e:'Este certificado figura en el registro.',rec.f,'Código verificado: '+shown);
 }catch(e){notFound()}
}
$('f').addEventListener('submit',e=>{e.preventDefault();verificar($('code').value)});
const c=new URLSearchParams(location.search).get('c');
if(c){$('code').value=c.toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/^(.{4})(.{5})(.*)$/,'$1 $2 $3');verificar(c)}
})();
</script>
</body>
</html>
